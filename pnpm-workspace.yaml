packages:
  - "packages/*"
  - "packages/@openmaic/*"
  - "!packages/docs" # standalone docs sub-app: own lockfile, build, deploy

overrides:
  "form-data@2.3.3": "2.5.6"
  "path-to-regexp@8.3.0": "8.4.0"
  "picomatch@2.3.1": "2.3.2"
  "fast-uri@>=3.0.0 <3.1.8": "3.1.8"
  "@modelcontextprotocol/sdk@>=1.12.0 <1.31.0": "1.31.0"
  "proxy-addr@>=2.0.0 <2.0.8": "2.0.8"
  "source-map-js@>=1.2.0 <1.2.2": "1.2.2"
  "ip-address@>=10.0.0 <10.7.1": "10.7.1"
  "moment@>=2.29.2 <2.31.0": "2.31.0"
  "hono@>=4.0.0 <4.13.7": "4.13.7"
  "brace-expansion@>=1.0.0 <1.1.20": "1.1.20"
  "brace-expansion@>=2.0.0 <2.1.6": "2.1.6"
  "brace-expansion@>=5.0.0 <5.0.11": "5.0.11"

# ESLint 10 is bridged through @eslint/compat until Next's plugins widen their
# peer ranges. TypeScript 6 is the official API companion for the TS 7 CLI.
peerDependencyRules:
  allowedVersions:
    eslint: "10"
    typescript: "6"
