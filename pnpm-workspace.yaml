packages:
  - "packages/*"
  - "packages/@openmaic/*"
  - "!packages/docs" # standalone docs sub-app: own lockfile, build, deploy

overrides:
  # Keep OMML conversion, but remove get-dom's obsolete jsdom/request stack.
  # get-dom 13 uses the current JSDOM constructor; its browser adapter is unchanged.
  "omml2mathml@1.3.0>get-dom": "13.0.0"
  "get-dom@13.0.0>jsdom": "29.1.1"
  # Chat uses the application's 0.18 stylesheet. Leave the versioned interactive
  # scene assets alone: older authored scenes can depend on 0.16's CSS classes.
  "@streamdown/math>katex": "0.18.4"
  "rehype-katex@7.0.1>katex": "0.18.4"
  "micromark-extension-math@3.1.0>katex": "0.18.4"
  "form-data@2.3.3": "2.5.6"
  "path-to-regexp@8.3.0": "8.4.0"
  "picomatch@2.3.1": "2.3.2"
  "fast-uri@>=3.0.0 <3.1.9": "3.1.9"
  "body-parser@>=2.0.0 <2.4.0": "2.4.0"
  "@modelcontextprotocol/sdk@>=1.12.0 <1.32.0": "1.32.0"
  "proxy-addr@>=2.0.0 <2.0.8": "2.0.8"
  "source-map-js@>=1.2.0 <1.2.2": "1.2.2"
  "ip-address@>=10.0.0 <10.7.4": "10.7.4"
  "moment@>=2.29.2 <2.31.0": "2.31.0"
  "hono@>=4.0.0 <4.13.11": "4.13.11"
  "qs@>=6.0.0 <6.16.0": "6.16.0"
  "brace-expansion@>=1.0.0 <1.1.20": "1.1.20"
  "brace-expansion@>=2.0.0 <2.1.6": "2.1.6"
  "brace-expansion@>=5.0.0 <5.0.11": "5.0.11"

# ESLint 10 is bridged through @eslint/compat until Next's plugins widen their
# peer ranges. TypeScript 6 is the official API companion for the TS 7 CLI.
peerDependencyRules:
  allowedVersions:
    eslint: "10"
    typescript: "6"
